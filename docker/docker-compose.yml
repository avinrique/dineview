services:
  postgres:
    image: postgres:16-alpine
    container_name: dineview-postgres
    restart: 'no'
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: dineview
      POSTGRES_PASSWORD: dineview_dev
      POSTGRES_DB: dineview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dineview']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dineview-redis
    restart: 'no'
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
